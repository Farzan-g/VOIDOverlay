name: VOID Overlay Termo - Windows verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Debug
        run: .\scripts\build.ps1 -Configuration Debug
      - name: Test Release
        run: .\scripts\test.ps1 -Configuration Release
      - name: Build Release
        run: .\scripts\build.ps1 -Configuration Release
      - name: Publish Windows x64
        run: .\scripts\publish.ps1
